<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Abian Keith Sibug | SEO, AI Search & Digital Marketing</title>
    <meta name="description" content="Abian Keith Sibug is an SEO and AI search specialist with 8+ years of experience in website management, social media, automation and digital marketing." />
    <meta name="author" content="Abian Keith Sibug" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F4F4ED" />
    <link rel="canonical" href="https://abian-portfolio.netlify.app/" />
    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F4F4ED" />
    <!-- <link rel="canonical" href="https://yoursite.com/" /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/avatar.png" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abian Keith Sibug" />
    <meta property="og:title" content="Abian Keith Sibug | SEO & AI Search Specialist" />
    <meta property="og:description" content="SEO, AI search, website management, social media and marketing automation for real estate and service brands." />
    <meta property="og:url" content="https://abian-portfolio.netlify.app/" />
    <meta property="og:image" content="https://abian-portfolio.netlify.app/avatar.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
